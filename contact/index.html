<!doctype html>
<html lang="en" data-root="../">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Pourly Made Co.</title>
<meta name="description" content="Questions about Pourly Made Co. soap and candles? Send a message.">
<meta property="og:title" content="Contact | Pourly Made Co.">
<meta property="og:description" content="Questions about Pourly Made Co. soap and candles? Send a message.">
<meta property="og:type" content="website">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="contact">
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main">

<section class="section">
  <div class="container contact-wrap">
    <div class="contact-intro">
      <p class="eyebrow">Contact</p>
      <h1>Say hello.</h1>
      <p class="muted">Questions about a product, a gift for him, or a custom batch? Send a message and expect a reply soon.</p>
      <p class="muted">Based in the Spokane, WA area.</p>
    </div>
    <form class="form" id="contact-form">
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <label>Name<input name="name" type="text" required autocomplete="name"></label>
      <label>Email<input name="email" type="email" required autocomplete="email"></label>
      <label>Message<textarea name="message" required></textarea></label>
      <button class="btn" type="submit">Send message</button>
      <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
</main>
<footer id="site-footer"></footer>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/products.js"></script>
<script src="../assets/js/site.js"></script>
</body>
</html>
